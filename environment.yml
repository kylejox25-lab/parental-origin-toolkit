name: parental_toolkit
channels:
  - bioconda
  - conda-forge
dependencies:
  - python>=3.9
  - pyyaml
  - snpsplit
  - bowtie2
  - hisat2               # optional: RNA-seq aligner (--aligner hisat2)
  - star                 # optional: RNA-seq aligner (--aligner star)
  - samtools
  - bcftools
  - picard
  - bedtools
  - subread              # featureCounts (pot-ase)
  - ucsc-bedgraphtobigwig
  - wget
# Users in China may want to add the Tsinghua bioconda mirror to channels
# (see docs/design.md).
